[project]
name = "finbank-risk-lakehouse"
version = "1.0.2"
description = "A local-first banking risk data platform with tested analytical products and controlled data access."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "pandas==3.0.5",
    "numpy==2.5.2",
    "faker==40.36.0",
    "requests==2.34.2",
    "chardet>=5.2,<8.0",
    "sqlalchemy==2.0.52",
    "sqlparse==0.6.0",
    "psycopg2-binary==2.9.12",
    "python-dotenv==1.2.2",
    "pyarrow==25.0.1",
    "streamlit==1.61.1",
    "plotly==6.9.0",
    "dbt-core==1.12.2",
    "dbt-postgres==1.11.0",
    "qdrant-client==1.19.0",
    "openai==3.0.0",
    "google-genai>=1.0.0,<3.0.0",
    "tenacity==9.1.4",
    "pyyaml==6.0.3",
    "dagster==1.13.17",
    "dagster-webserver==1.13.17",
    "duckdb==1.5.5",
    "dbt-duckdb==1.11.0",
    "duckdb-engine>=0.13.0",
    "kafka-python-ng==2.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.3",
    "sqlfluff==4.3.0",
    "sqlfluff-templater-dbt==4.3.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.sqlfluff.core]
dialect = "postgres"
templater = "dbt"
sql_file_exts = ".sql"
max_line_length = 110

[tool.sqlfluff.templater.dbt]
project_dir = "dbt"
profiles_dir = "dbt"

[tool.uv]
constraint-dependencies = [
    "cryptography>=50.0.0",
    "gitpython>=3.1.58",
    "h2>=4.4.1",
]
